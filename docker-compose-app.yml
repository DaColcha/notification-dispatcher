name: notification-dispatcher
services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'

  event-producer:
    build:
      context: .
      dockerfile: event-producer/Dockerfile
    container_name: event-producer
    ports:
      - "8081:8081"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka

  email-consumer:
    build:
      context: .
      dockerfile: email-consumer/Dockerfile
    container_name: email-consumer
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM=${RESEND_FROM:-}
    depends_on:
      - kafka

  discord-consumer:
    build:
      context: .
      dockerfile: discord-consumer/Dockerfile
    container_name: discord-consumer
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DISCORD_CHANNEL_URL=${DISCORD_CHANNEL_URL:-}
    depends_on:
      - kafka

  slack-consumer:
    build:
      context: .
      dockerfile: slack-consumer/Dockerfile
    container_name: slack-consumer
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SLACK_WEBHOOK=${SLACK_WEBHOOK:-}
    depends_on:
      - kafka

  ws-gateway:
    build:
      context: .
      dockerfile: ws-gateway/Dockerfile
    container_name: ws-gateway
    ports:
      - "8085:8085"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: notification-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_WS_GATEWAY_URL: ws://localhost:8085/ws
    depends_on:
      - ws-gateway
      - event-producer